name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install fastapi==0.115.6 pydantic-settings==2.7.1 python-multipart==0.0.20 httpx==0.28.1 pytest==8.3.4
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/hf_space/Dockerfile --build-arg WARMUP=0 -t servicedesk-copilot .
