# Runs as non-root: all writable paths live in /tmp.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;
  client_max_body_size 50m;
  proxy_read_timeout 300s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 7860;

    # FastAPI: REST API + Swagger/ReDoc
    location ~ ^/(api/|docs|redoc|openapi\.json|health) {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streamlit UI (needs websocket upgrade)
    location / {
      proxy_pass http://127.0.0.1:8501;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }
}
